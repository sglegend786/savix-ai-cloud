{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5 border-danger">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4 text-danger">Admin Portal</h4>
                <form method="POST">
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button class="btn btn-danger w-100" type="submit">Admin Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
