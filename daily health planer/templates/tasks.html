<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="{% if theme == 'dark' %}dark-mode{% endif %}">

<div class="container mt-5">

<h2 class="mb-4">📋 All Tasks</h2>

<a href="/" class="btn btn-primary mb-3">
← Back to Dashboard
</a>

<!-- ================= TASK SEARCH & FILTER ================= -->

<div class="card shadow-sm mb-4">
    <div class="card-body">

        <h5 class="mb-3">🔎 Search & Filter Tasks</h5>

        <form method="GET" action="/tasks">

            <div class="row g-3">

                <!-- Search -->
                <div class="col-md-3">

                    <label class="form-label">
                        Search Task
                    </label>

                    <input
                        type="text"
                        name="search"
                        class="form-control"
                        placeholder="Search by title..."
                        value="{{ search or '' }}"
                    >

                </div>


                <!-- Category -->
                <div class="col-md-3">

                    <label class="form-label">
                        Category
                    </label>

                    <select name="category" class="form-select">

                        <option value="">
                            All Categories
                        </option>

                        <option value="Study"
                            {% if category == 'Study' %}selected{% endif %}>
                            Study
                        </option>

                        <option value="Health"
                            {% if category == 'Health' %}selected{% endif %}>
                            Health
                        </option>

                        <option value="Work"
                            {% if category == 'Work' %}selected{% endif %}>
                            Work
                        </option>

                        <option value="Personal"
                            {% if category == 'Personal' %}selected{% endif %}>
                            Personal
                        </option>

                    </select>

                </div>


                <!-- Priority -->
                <div class="col-md-2">

                    <label class="form-label">
                        Priority
                    </label>

                    <select name="priority" class="form-select">

                        <option value="">
                            All
                        </option>

                        <option value="High"
                            {% if priority == 'High' %}selected{% endif %}>
                            High
                        </option>

                        <option value="Medium"
                            {% if priority == 'Medium' %}selected{% endif %}>
                            Medium
                        </option>

                        <option value="Low"
                            {% if priority == 'Low' %}selected{% endif %}>
                            Low
                        </option>

                    </select>

                </div>


                <!-- Status -->
                <div class="col-md-2">

                    <label class="form-label">
                        Status
                    </label>

                    <select name="status" class="form-select">

                        <option value="">
                            All
                        </option>

                        <option value="Pending"
                            {% if status == 'Pending' %}selected{% endif %}>
                            Pending
                        </option>

                        <option value="Completed"
                            {% if status == 'Completed' %}selected{% endif %}>
                            Completed
                        </option>

                    </select>

                </div>


                <!-- Buttons -->
                <div class="col-md-2 d-flex align-items-end">

                    <button
                        type="submit"
                        class="btn btn-primary me-2">
                        Filter
                    </button>

                    <a
                        href="/tasks"
                        class="btn btn-outline-secondary">
                        Clear
                    </a>

                </div>

            </div>

        </form>

    </div>
</div>

<!-- ================= END SEARCH & FILTER ================= -->

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>Task</th>

<th>Description</th>

<th>Category</th>

<th>Priority</th>

<th>Status</th>

</tr>

</thead>

<tbody>

{% for task in tasks %}

<tr>

<td>{{ task.title }}</td>

<td>{{ task.description }}</td>

<td>{{ task.category }}</td>

<td>{{ task.priority }}</td>

<td>{{ task.status }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
