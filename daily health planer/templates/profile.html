<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Daily Life Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .profile-container {
            max-width: 850px;
            margin: 40px auto;
        }

        .profile-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        .profile-header {
            background: linear-gradient(135deg, #0d6efd, #6f42c1);
            color: white;
            padding: 35px;
            text-align: center;
        }

        .profile-icon {
            font-size: 80px;
            margin-bottom: 10px;
        }

        .profile-body {
            padding: 35px;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .info-label {
            color: #6c757d;
            font-size: 14px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>

<body class="{% if theme == 'dark' %}dark-mode{% endif %}">

<div class="container profile-container">

    <a href="/" class="btn btn-primary mb-4">
        ← Back to Dashboard
    </a>

    <div class="card profile-card">

        <div class="profile-header">

            <div class="profile-icon">
                👤
            </div>

            <h2>{{ user.full_name }}</h2>

            <p class="mb-0">Daily Life Manager User</p>

        </div>

        <div class="profile-body">

            <h4 class="mb-4">Profile Information</h4>

            <div class="info-box">

                <div class="info-label">
                    Full Name
                </div>

                <div class="info-value">
                    {{ user.full_name }}
                </div>

            </div>

            <div class="info-box">

                <div class="info-label">
                    Email
                </div>

                <div class="info-value">
                    {{ user.email }}
                </div>

            </div>

            <div class="info-box">

                <div class="info-label">
                    User ID
                </div>

                <div class="info-value">
                    {{ user.user_id }}
                </div>

            </div>

            <div class="text-center mt-4">

                <button class="btn btn-primary px-4"
                        data-bs-toggle="modal"
                        data-bs-target="#editProfileModal">

                    ✏️ Edit Profile

                </button>

            </div>

        </div>

    </div>

</div>


<!-- Edit Profile Modal -->

<div class="modal fade" id="editProfileModal">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Edit Profile
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <form action="/update-profile" method="POST">

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               name="full_name"
                               class="form-control"
                               value="{{ user.full_name }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ user.email }}"
                               required>

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit"
                            class="btn btn-primary">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
