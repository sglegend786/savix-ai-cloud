<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="{% if theme == 'dark' %}dark-mode{% endif %}">

<div class="container mt-4">

    <h2 class="mb-4">📅 Task Calendar</h2>

    <a href="/" class="btn btn-primary mb-3">
        ← Back to Dashboard
    </a>

    <div id="calendar"></div>

    <div id="taskDetails" class="task-details">
    <span id="closePanel">&times;</span>

    <h4>📋 Task Details</h4>

    <p><strong>Task:</strong> <span id="taskTitle"></span></p>

    <p><strong>Priority:</strong> <span id="taskPriority"></span></p>

    <p><strong>Status:</strong> <span id="taskStatus"></span></p>

    <p><strong>Due Date:</strong> <span id="taskDate"></span></p>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {

    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 700,
        nowIndicator: true,

        events: [
{% for task in tasks %}
{
    title: "{{ task.title }}",
    start: "{{ task.start_date }}",
    end: "{{ task.end_date }}",

    color:
    {% if task.priority == "High" %}
        "#dc3545"
    {% elif task.priority == "Medium" %}
        "#ffc107"
    {% else %}
        "#198754"
    {% endif %},

    extendedProps: {
        priority: "{{ task.priority }}",
        status: "{{ task.status }}"
    }
}
{% if not loop.last %},{% endif %}
{% endfor %}
],

        eventClick: function(info) {

    document.getElementById("taskTitle").innerHTML =
        info.event.title;

    document.getElementById("taskPriority").innerHTML =
        info.event.extendedProps.priority;

    document.getElementById("taskStatus").innerHTML =
        info.event.extendedProps.status;

    document.getElementById("taskDate").innerHTML =
        info.event.start.toLocaleDateString();

    document.getElementById("taskDetails").classList.add("show");

}
});

    calendar.render();

    document.getElementById("closePanel").onclick = function () {
    document.getElementById("taskDetails").classList.remove("show");
};

document.addEventListener("click", function(e){

    const panel = document.getElementById("taskDetails");

    if(
        !panel.contains(e.target) &&
        !e.target.closest(".fc-event")
    ){
        panel.classList.remove("show");
    }

});

});

</script>
</body>

</html>
