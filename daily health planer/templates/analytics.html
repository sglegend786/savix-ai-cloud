<!DOCTYPE html>
<html>

<head>

    <title>Analytics</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="{% if theme == 'dark' %}dark-mode{% endif %}">

<div class="container mt-4">

    <h2>📊 Analytics Dashboard</h2>

    <a href="/" class="btn btn-primary mt-3 mb-4">
        ← Back to Dashboard
    </a>



<div class="row mb-4">

    <!-- Total Tasks -->
    <div class="col-md-3 mb-3">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
                <h6 class="text-muted">Total Tasks</h6>
                <h2 class="fw-bold">{{ completed + pending }}</h2>
                <p class="mb-0 text-primary">All Tasks</p>
            </div>
        </div>
    </div>

    <!-- Completed -->
    <div class="col-md-3 mb-3">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
                <h6 class="text-muted">Completed</h6>
                <h2 class="fw-bold text-success">{{ completed }}</h2>
                <p class="mb-0 text-success">Tasks completed</p>
            </div>
        </div>
    </div>

    <!-- Pending -->
    <div class="col-md-3 mb-3">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
                <h6 class="text-muted">Pending</h6>
                <h2 class="fw-bold text-warning">{{ pending }}</h2>
                <p class="mb-0 text-warning">Tasks remaining</p>
            </div>
        </div>
    </div>

    <!-- Completion Rate -->
    <div class="col-md-3 mb-3">
        <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
                <h6 class="text-muted">Completion Rate</h6>
                <h2 class="fw-bold text-primary">{{ completion_rate }}%</h2>
                <p class="mb-0 text-primary">Overall progress</p>
            </div>
        </div>
    </div>

</div>

    <div class="row">

        <div class="col-md-6">

            <div class="card shadow p-3">

                <h4>Completed vs Pending</h4>

                <canvas id="pieChart"></canvas>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card shadow p-3">

                <h4>Tasks by Category</h4>

                <canvas id="barChart"></canvas>

            </div>

        </div>

    </div>
    
    <div class="row mt-4">

    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-3">
            <h4 class="mb-3">Tasks by Priority</h4>
            <canvas id="priorityChart"></canvas>
        </div>
    </div>

</div>
    


</div>

<script>

new Chart(document.getElementById("pieChart"),{

type:"pie",

data:{

labels:["Completed","Pending"],

datasets:[{

data:[{{ completed }},{{ pending }}],

backgroundColor:["green","orange"]

}]

}

});

new Chart(document.getElementById("barChart"),{

type:"bar",

data:{

labels:{{ categories|safe }},

datasets:[{

label:"Tasks",

data:{{ counts|safe }}

}]

}

});

</script>

<script>
const priorityLabels = {{ priorities | tojson }};
const priorityData = {{ priority_counts | tojson }};

new Chart(document.getElementById('priorityChart'), {
    type: 'bar',

    data: {
        labels: priorityLabels,

        datasets: [{
            label: 'Tasks',
            data: priorityData,
            backgroundColor: [
                '#dc3545',
                '#ffc107',
                '#198754'
            ]
        }]
    },

    options: {
        responsive: true,

        plugins: {
            legend: {
                display: false
            }
        }
    }
});
</script>

</body>

</html>
