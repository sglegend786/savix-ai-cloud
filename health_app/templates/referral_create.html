{% extends "base.html" %}
{% block title %}Create Referral | HealthCare+{% endblock %}
{% block page_title %}Create Referral{% endblock %}
{% block content %}
<div class="app-card">
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Patient *</label>
        <select name="patientId" class="form-select" required>
          <option value="">Select a patient...</option>
          {% for p in patients %}
          <option value="{{ p._id }}">{{ p.name }} ({{ p.village }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Refer To (Facility) *</label>
        <input type="text" name="toFacility" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Specialist / Department</label>
        <input type="text" name="specialist" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Priority</label>
        <select name="priority" class="form-select">
          <option>High</option><option selected>Medium</option><option>Low</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Reason for Referral</label>
        <textarea name="reason" class="form-control" rows="2" required></textarea>
      </div>
      <div class="col-12">
        <label class="form-label">Symptoms (comma separated, optional)</label>
        <input type="text" name="symptoms" class="form-control" placeholder="fever, breathing difficulty">
      </div>
      <div class="col-md-6">
        <label class="form-label">Appointment Date</label>
        <input type="date" name="appointmentDate" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Expected Arrival Date</label>
        <input type="date" name="expectedArrivalDate" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Follow-up Date</label>
        <input type="date" name="followUpDate" class="form-control">
      </div>
      <div class="col-12">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="2"></textarea>
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3"><i class="bi bi-signpost-split"></i> Create Referral</button>
  </form>
</div>
{% endblock %}
