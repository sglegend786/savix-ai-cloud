{% extends "base.html" %}
{% block title %}Upload Report | HealthCare+{% endblock %}
{% block page_title %}Upload Medical Report{% endblock %}
{% block content %}
<div class="app-card" style="max-width:600px">
  <form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Report Name</label>
      <input type="text" name="report_name" class="form-control" placeholder="e.g. Blood Test - Aug 2026">
    </div>
    <div class="mb-3">
      <label class="form-label">Report Type</label>
      <select name="report_type" class="form-select">
        {% for t in report_types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">File (PDF, JPG, JPEG, PNG — max 10MB)</label>
      <input type="file" name="report_file" class="form-control" accept=".pdf,.jpg,.jpeg,.png" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Upload Report</button>
  </form>
</div>
{% endblock %}
