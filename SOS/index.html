<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SAVIX-AI &mdash; Enterprise Emergency Platform</title>
<script>
  // True Single Sign-On from Main Hub to SOS App
  const mainSession = localStorage.getItem('savix_session');
  if (!mainSession) {
    window.location.replace('/index.html');
  } else {
    try {
      const parsedSession = JSON.parse(mainSession);
      const user = parsedSession.user || {};
      
      // If the SOS app doesn't have an active session yet, create one from the Main Hub user data
      if (!sessionStorage.getItem('savix_ses_v6')) {
        const sosSession = {
          name: user.name || 'SAVIX User',
          email: user.email || '',
          phone: user.phone || '',
          contacts: [],
          medical: { blood: 'O+' }
        };
        sessionStorage.setItem('savix_ses_v6', JSON.stringify(sosSession));
      }
    } catch (e) {
      console.error('SSO parsing error', e);
    }
  }
</script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f1a;--bg2:#111827;--bg3:#1a2236;--card:#161e30;--card2:#1e2a40;
  --border:#253047;--olive:#4d7c0f;--olive2:#65a30d;--olive3:#84cc16;
  --red:#dc2626;--txt:#e2e8f0;--txt2:#94a3b8;--txt3:#64748b;
  --glow:rgba(77,124,15,.3);--glow-red:rgba(220,38,38,.35);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#253047;border-radius:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px}
.card2{background:var(--card2);border:1px solid var(--border);border-radius:14px}
.glass{background:rgba(22,30,48,.9);backdrop-filter:blur(20px);border:1px solid var(--border)}
.fi{width:100%;padding:10px 14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;color:var(--txt);font-size:13px;font-family:inherit;outline:none}
.fi:focus{border-color:var(--olive3);box-shadow:0 0 0 3px var(--glow)}
label{font-size:11px;font-weight:700;color:var(--txt2);letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:.2s}
.btn-g{background:linear-gradient(135deg,var(--olive),var(--olive2));color:#fff;box-shadow:0 4px 14px var(--glow)}
.btn-g:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-r{background:linear-gradient(135deg,#991b1b,var(--red));color:#fff;box-shadow:0 4px 14px var(--glow-red)}
.btn-r:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-q{background:var(--bg3);color:var(--txt2);border:1px solid var(--border)}
.btn-q:hover{border-color:var(--olive3);color:var(--txt)}
.nav-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;border:none;font-family:inherit;color:var(--txt2);background:transparent}
.nav-btn.on{background:linear-gradient(135deg,var(--olive),var(--olive2));color:#fff;box-shadow:0 3px 10px var(--glow)}
.nav-btn:not(.on):hover{background:var(--bg3);color:var(--txt)}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.8);opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow-red)}50%{box-shadow:0 0 0 28px rgba(220,38,38,0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes wave{0%,100%{height:3px}50%{height:100%}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.up{animation:up .3s ease-out}
.sos-btn{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f87171,#7f1d1d);border:3px solid rgba(255,255,255,.2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;animation:pulse 2s infinite;position:relative;flex-shrink:0}
.sos-btn::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(220,38,38,.4);animation:ring 2s infinite}
.sos-btn::after{content:'';position:absolute;inset:-22px;border-radius:50%;border:2px solid rgba(220,38,38,.2);animation:ring 2.2s .6s infinite}
.sos-btn:active{transform:scale(.96)}
.wbar{width:3px;border-radius:2px;background:var(--olive3);animation:wave 1.1s ease-in-out infinite;align-self:center}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-g{background:#22c55e;box-shadow:0 0 8px #22c55e;animation:blink 2s infinite}
.dot-r{background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1s infinite}
.sw{position:relative;width:42px;height:23px;background:var(--bg3);border:1.5px solid var(--border);border-radius:100px;cursor:pointer;transition:.3s;flex-shrink:0}
.sw.on{background:var(--olive);border-color:var(--olive)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.sw.on::after{left:21px}
.pill{display:inline-flex;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:700}
.pill-g{background:rgba(77,124,15,.2);color:var(--olive3);border:1px solid rgba(77,124,15,.3)}
.pill-r{background:rgba(220,38,38,.2);color:#f87171;border:1px solid rgba(220,38,38,.3)}
.pill-b{background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.3)}
.pbar{height:6px;background:var(--bg3);border-radius:100px;overflow:hidden}
.pfill{height:100%;border-radius:100px;transition:width .6s}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.ai-msg{background:rgba(77,124,15,.1);border:1px solid rgba(77,124,15,.2);border-radius:14px 14px 14px 4px;padding:9px 13px;max-width:84%;font-size:12px;color:var(--txt)}
.u-msg{background:var(--bg3);border:1px solid var(--border);border-radius:14px 14px 4px 14px;padding:9px 13px;max-width:84%;margin-left:auto;font-size:12px;color:var(--txt)}
.leaflet-container{background:#111827!important}
.leaflet-tile{filter:brightness(.65) saturate(.7) hue-rotate(8deg)}
.umark{width:18px;height:18px;background:var(--red);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 5px rgba(220,38,38,.3),0 0 18px rgba(220,38,38,.5)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

/* ─── STORAGE ───────────────────────────────── */
const DB='savix_v6', SE='savix_ses_v6';
const loadDB=()=>{try{return JSON.parse(localStorage.getItem(DB)||'{}')}catch{return{}}};
const saveDB=d=>localStorage.setItem(DB,JSON.stringify(d));
const loadSes=()=>{try{return JSON.parse(sessionStorage.getItem(SE)||'null')}catch{return null}};
const saveSes=s=>sessionStorage.setItem(SE,JSON.stringify(s));
const clearSes=()=>sessionStorage.removeItem(SE);

/* ─── STATE ─────────────────────────────────── */
const S={
  ses:loadSes(), authTab:'login', tab:'dashboard',
  gps:null, locName:'Acquiring GPS...', accuracy:0, speed:0, heading:null, watchId:null,
  svcs:[], mapCat:'all',
  sos:null, sosMode:'hold', sosCat:'Personal Security Threat', timeline:[],
  aiOn:false, voiceRec:null, ambVol:0,
  audRec:false, audRecObj:null, audChunks:[], audStream:null, audCtx:null, audAna:null, audBlob:null,
  vidRec:false, vidRecObj:null, vidChunks:[], vidStream:null, vidBlob:null,
  shakeN:0, shakeLast:0, lastAcc:{x:0,y:0,z:0}, motionOn:false, fallOn:false,
  map:null, uMarker:null, svcMarks:[], track:null, trackPts:[], arrow:null,
  battery:null, aiMsgs:[], logs:[],
  cfg:{shakeThr:15,shakeN:5,shakeWin:2000,voiceLang:'en-IN',
       fallOn:true,fallSec:15,sirenOn:true,ttsOn:true,
       vidOnSos:false,ambOn:false,checkIn:60},
};

/* ─── GEO HELPERS ───────────────────────────── */
function hdist(a,b,c,d){
  const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,
    e=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;
  return+(R*2*Math.atan2(Math.sqrt(e),Math.sqrt(1-e))*1000).toFixed(0);
}
const fDist=m=>m<1000?m+'m':+(m/1000).toFixed(1)+'km';
const fEta=m=>{const n=Math.round(m/80);return n<60?'~'+n+'m':'~'+Math.floor(n/60)+'h '+n%60+'m'};

async function fetchSvcs(lat,lng,cat='all'){
  const R=3000;
  const catQ={hospital:'amenity=hospital',police:'amenity=police',pharmacy:'amenity=pharmacy',
    bus_station:'highway=bus_stop',fire:'amenity=fire_station',atm:'amenity=atm',
    railway:'railway=station',airport:'aeroway=aerodrome'};
  const cats=cat==='all'
    ?['hospital','police','pharmacy','bus_station','fire','atm','railway']
    :[cat];
  const body=cats.map(c=>`node[${catQ[c]}](around:${R},${lat},${lng});`).join('');
  const q=`[out:json][timeout:14];(${body});out body 40;`;
  try{
    const r=await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`,
      {signal:AbortSignal.timeout(12000)});
    const d=await r.json();
    const CATS={hospital:{i:'🏥',c:'hospital'},police:{i:'🚔',c:'police'},pharmacy:{i:'💊',c:'pharmacy'},
      bus_stop:{i:'🚌',c:'bus_station'},fire_station:{i:'🚒',c:'fire'},atm:{i:'🏧',c:'atm'},
      station:{i:'🚉',c:'railway'},aerodrome:{i:'✈️',c:'airport'}};
    return (d.elements||[]).map(el=>{
      const t=el.tags||{};
      const key=t.amenity||t.highway||t.railway||t.aeroway||'place';
      const ci=CATS[key]||{i:'📍',c:'place'};
      return{id:el.id,name:t.name||t['name:en']||ci.c,cat:ci.c,icon:ci.i,
        lat:el.lat,lng:el.lon,dist:hdist(lat,lng,el.lat,el.lon),phone:t.phone||''};
    }).sort((a,b)=>a.dist-b.dist).slice(0,40);
  }catch{return[]}
}

async function revGeo(lat,lng){
  try{
    const r=await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=en`,
      {signal:AbortSignal.timeout(8000)});
    const d=await r.json();
    if(d&&d.display_name)return d.display_name.split(',').slice(0,4).join(', ').trim();
  }catch{}
  return lat.toFixed(5)+'°, '+lng.toFixed(5)+'°';
}

/* ─── GPS ───────────────────────────────────── */
function startGPS(){
  if(!navigator.geolocation){S.locName='GPS not supported';render();return}
  if(S.watchId!=null)navigator.geolocation.clearWatch(S.watchId);
  navigator.geolocation.getCurrentPosition(onPos,()=>{S.locName='GPS denied – enable location';render()},
    {enableHighAccuracy:true,timeout:15000,maximumAge:0});
  S.watchId=navigator.geolocation.watchPosition(onPos,()=>{},
    {enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
async function onPos(p){
  const{latitude:lat,longitude:lng,accuracy,speed,heading}=p.coords;
  S.gps={lat,lng};S.accuracy=Math.round(accuracy||5);
  S.speed=speed?Math.round(speed*3.6):0;S.heading=heading;
  moveUMarker();moveArrow();
  if(S.sos){S.trackPts.push([lat,lng]);drawTrack()}
  if(document.getElementById('ui-gps')) document.getElementById('ui-gps').textContent=lat.toFixed(4)+', '+lng.toFixed(4);
  if(document.getElementById('ui-acc')) document.getElementById('ui-acc').textContent='±'+S.accuracy+'m';
  if(document.getElementById('ui-spd')) document.getElementById('ui-spd').textContent=S.speed+'km/h';
  const[name,svcs]=await Promise.all([revGeo(lat,lng),fetchSvcs(lat,lng,S.mapCat)]);
  S.locName=name;S.svcs=svcs;placeSvcMarks();
  if(document.getElementById('ui-loc')) document.getElementById('ui-loc').textContent=name.split(',')[0];
  if(document.getElementById('ui-nloc')) document.getElementById('ui-nloc').textContent=name.split(',').slice(0,2).join(',');
  if(S.tab==='nearby' && document.getElementById('nearby-svcs-list')) {
     const svs = S.svcs.slice(0,20).map(s=>'<div class="card2" style="padding:9px;display:flex;align-items:center;gap:7px"><span style="font-size:1.2rem">'+s.icon+'</span><div style="min-width:0;flex:1"><div style="font-size:10px;font-weight:700;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+s.name+'</div><div style="font-size:9px;color:var(--txt3)">'+fDist(s.dist)+' · '+fEta(s.dist)+'</div></div>'+(s.phone?'<a href="tel:'+s.phone+'" class="btn btn-g" style="font-size:9px;padding:3px 7px;text-decoration:none">Call</a>':'')+'</div>').join('');
     document.getElementById('nearby-svcs-list').innerHTML = svs;
     document.getElementById('nearby-svcs-count').textContent = '📋 Services Found ('+S.svcs.length+')';
  }
}

/* ─── MAP ───────────────────────────────────── */
const CAT_COL={hospital:'#10b981',police:'#3b82f6',pharmacy:'#8b5cf6',
  bus_station:'#f59e0b',fire:'#ef4444',atm:'#06b6d4',railway:'#6366f1',airport:'#0ea5e9'};
const SVC_TYPES=[
  {k:'all',l:'All',i:'🔍'},{k:'hospital',l:'Hospital',i:'🏥'},
  {k:'police',l:'Police',i:'🚔'},{k:'pharmacy',l:'Pharmacy',i:'💊'},
  {k:'bus_station',l:'Bus Stop',i:'🚌'},{k:'fire',l:'Fire Stn',i:'🚒'},
  {k:'atm',l:'ATM',i:'🏧'},{k:'railway',l:'Railway',i:'🚉'},
  {k:'airport',l:'Airport',i:'✈️'},
];

function initMap(id){
  const el=document.getElementById(id);if(!el)return;
  try{if(S.map)S.map.remove()}catch{}
  S.map=null;S.uMarker=null;S.svcMarks=[];S.track=null;S.arrow=null;
  const ctr=S.gps?[S.gps.lat,S.gps.lng]:[20.5937,78.9629];
  S.map=L.map(el,{zoomControl:true,attributionControl:false}).setView(ctr,S.gps?15:5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(S.map);
  if(S.gps){moveUMarker();placeSvcMarks()}
  if(S.trackPts.length)drawTrack();
}
function moveUMarker(){
  if(!S.map||!S.gps)return;
  const{lat,lng}=S.gps;
  const ic=L.divIcon({className:'',html:'<div class="umark"></div>',iconSize:[18,18],iconAnchor:[9,9]});
  if(S.uMarker)S.uMarker.setLatLng([lat,lng]);
  else S.uMarker=L.marker([lat,lng],{icon:ic,zIndexOffset:1000}).addTo(S.map)
    .bindPopup('<b>📍 You</b><br/>'+S.locName.split(',')[0]);
  if(S.map.getZoom()<12)S.map.setView([lat,lng],15);
  else S.map.panTo([lat,lng]);
}
function placeSvcMarks(){
  if(!S.map)return;
  S.svcMarks.forEach(m=>m.remove());S.svcMarks=[];
  S.svcs.forEach(s=>{
    const col=CAT_COL[s.cat]||'#64748b';
    const ic=L.divIcon({className:'',
      html:`<div style="width:28px;height:28px;background:${col};border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.4)">${s.icon}</div>`,
      iconSize:[28,28],iconAnchor:[14,14]});
    S.svcMarks.push(L.marker([s.lat,s.lng],{icon:ic}).addTo(S.map)
      .bindPopup(`<b>${s.icon} ${s.name}</b><br/>📏 ${fDist(s.dist)} · ⏱ ${fEta(s.dist)}`));
  });
}
function drawTrack(){
  if(!S.map||!S.trackPts.length)return;
  if(S.track)S.track.setLatLngs(S.trackPts);
  else S.track=L.polyline(S.trackPts,{color:'#ef4444',weight:4,dashArray:'10 6',opacity:.8}).addTo(S.map);
}
function moveArrow(){
  if(!S.map||!S.gps||S.heading==null)return;
  try{if(S.arrow)S.arrow.remove()}catch{}
  const R=.003,rad=S.heading*Math.PI/180;
  const elat=S.gps.lat+Math.cos(rad)*R,elng=S.gps.lng+Math.sin(rad)*R;
  S.arrow=L.polyline([[S.gps.lat,S.gps.lng],[elat,elng]],
    {color:'#84cc16',weight:4,dashArray:'8 4',opacity:.85}).addTo(S.map);
  const tip=L.divIcon({className:'',
    html:'<div style="width:8px;height:8px;background:#84cc16;border:2px solid #fff;border-radius:50%"></div>',
    iconSize:[8,8],iconAnchor:[4,4]});
  L.marker([elat,elng],{icon:tip}).addTo(S.map);
}

/* ─── VOICE AI ───────────────────────────────── */
const KWS=['help','save me','bachao','fire','accident','kidnap','help me','sos','mujhe help','emergency','mujhe bachao'];
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){aiMsg('⚠️ Voice detection needs Chrome browser.','ai');return}
  if(S.voiceRec)S.voiceRec.stop();
  const r=new SR();
  r.continuous=true;r.interimResults=true;r.lang=S.cfg.voiceLang;
  r.onresult=e=>{
    let t='';
    for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript.toLowerCase();
    const kw=KWS.find(k=>t.includes(k));
    if(kw&&!S.sos){
      aiMsg('🎤 Detected: "<b>'+kw+'</b>". Auto-SOS in 5s — tap Cancel if safe.','ai');
      let tm=setTimeout(()=>{if(!S.sos)triggerSOS('Voice AI')},5000);
      const bn=document.getElementById('vbanner');
      if(bn)bn.innerHTML=`<div class="glass up" style="border-radius:14px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div style="display:flex;align-items:center;gap:8px"><span style="font-size:1.3rem;animation:blink 1s infinite">🎤</span>
          <div><div style="font-size:11px;font-weight:900;color:#f87171">Keyword: "${kw}"</div>
          <div style="font-size:9px;color:var(--txt2)">Auto-SOS in 5s</div></div></div>
        <div style="display:flex;gap:5px">
          <button onclick="document.getElementById('vbanner').innerHTML='';clearTimeout(${tm})" class="btn btn-q" style="font-size:10px;padding:5px 10px">✗ Safe</button>
          <button onclick="triggerSOS('Voice Command');document.getElementById('vbanner').innerHTML=''" class="btn btn-r" style="font-size:10px;padding:5px 10px">🚨 SOS</button>
        </div></div>`;
    }
  };
  r.onerror=()=>{if(S.aiOn)setTimeout(()=>S.voiceRec&&S.voiceRec.start(),1000)};
  r.onend=()=>{if(S.aiOn&&S.voiceRec)S.voiceRec.start()};
  S.voiceRec=r;S.aiOn=true;r.start();
  aiMsg('🎤 AI voice monitoring ON. Say "Help", "Bachao" or "SOS".','ai');render();
}
function stopVoice(){
  if(S.voiceRec){S.voiceRec.stop();S.voiceRec=null}
  S.aiOn=false;render();
}
function tts(text){
  if(!S.cfg.ttsOn||!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';u.rate=.95;
  const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('en'));if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* ─── MOTION ─────────────────────────────────── */
function initMotion(){
  if(!window.DeviceMotionEvent){aiMsg('⚠️ Motion sensor not available.','ai');return}
  if(typeof DeviceMotionEvent.requestPermission==='function'){
    DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted')attachMotion()}).catch(()=>{});
  }else attachMotion();
}
function attachMotion(){
  S.motionOn=true;window.addEventListener('devicemotion',onMotion);
  aiMsg('📳 Shake detection active. Shake '+S.cfg.shakeN+'× to trigger SOS.','ai');render();
}
function onMotion(e){
  const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;
  const{x=0,y=0,z=0}=a;
  const mag=Math.sqrt(x**2+y**2+z**2);
  const now=Date.now();
  const delta=Math.abs(mag-Math.sqrt(S.lastAcc.x**2+S.lastAcc.y**2+S.lastAcc.z**2));
  if(delta>S.cfg.shakeThr){
    const gap=now-S.shakeLast;
    if(gap>80&&gap<S.cfg.shakeWin){
      S.shakeN++;
      const el=document.getElementById('shk');if(el)el.textContent=S.shakeN;
      if(S.shakeN>=S.cfg.shakeN){S.shakeN=0;if(!S.sos)triggerSOS('Shake Detection')}
    }else if(gap>=S.cfg.shakeWin)S.shakeN=1;
    S.shakeLast=now;
  }
  if(S.cfg.fallOn&&!S.fallOn&&mag>25){S.fallOn=true;startFall()}
  S.lastAcc={x,y,z};
}

/* ─── FALL ───────────────────────────────────── */
let fallTimer=null,fallSecs=0;
function startFall(){
  fallSecs=S.cfg.fallSec;
  let el=document.getElementById('fall-modal');
  if(!el){el=document.createElement('div');el.id='fall-modal';document.body.appendChild(el)}
  el.innerHTML=`<div class="overlay"><div class="modal up" style="max-width:360px;text-align:center">
    <div style="font-size:3rem;margin-bottom:8px">⚠️</div>
    <h3 style="font-size:1.1rem;font-weight:900;color:#ef4444;margin-bottom:6px">Fall Detected!</h3>
    <p style="font-size:11px;color:var(--txt2);margin-bottom:14px">Auto-SOS in <span id="fsec">${fallSecs}</span>s if no response.</p>
    <div style="display:flex;gap:10px">
      <button onclick="cancelFall()" class="btn btn-q" style="flex:1">✅ I'm OK</button>
      <button onclick="clearInterval(fallTimer);closeFall();triggerSOS('Fall Detection')" class="btn btn-r" style="flex:1">🚨 Help!</button>
    </div></div></div>`;
  tts('Fall detected! Are you okay? SOS activates in '+fallSecs+' seconds.');
  fallTimer=setInterval(()=>{
    fallSecs--;
    const s=document.getElementById('fsec');if(s)s.textContent=fallSecs;
    if(fallSecs<=0){clearInterval(fallTimer);closeFall();if(!S.sos)triggerSOS('Fall Detection')}
  },1000);
}
function cancelFall(){clearInterval(fallTimer);S.fallOn=false;closeFall();aiMsg('✅ Fall OK — monitoring resumed.','ai')}
function closeFall(){const e=document.getElementById('fall-modal');if(e)e.innerHTML='';S.fallOn=false}

/* ─── AUDIO ──────────────────────────────────── */
async function startAudio(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    S.audStream=st;S.audChunks=[];
    S.audCtx=new(window.AudioContext||window.webkitAudioContext)();
    S.audAna=S.audCtx.createAnalyser();S.audAna.fftSize=64;
    S.audCtx.createMediaStreamSource(st).connect(S.audAna);
    S.audRecObj=new MediaRecorder(st);
    S.audRecObj.ondataavailable=e=>{if(e.data.size>0)S.audChunks.push(e.data)};
    S.audRecObj.onstop=()=>{S.audBlob=new Blob(S.audChunks,{type:'audio/webm'})};
    S.audRecObj.start(1000);S.audRec=true;
    startWave();aiMsg('🎙️ Audio recording started.','ai');render();
  }catch{aiMsg('⚠️ Microphone access denied.','ai')}
}
function stopAudio(){
  if(S.audRecObj&&S.audRecObj.state!=='inactive')S.audRecObj.stop();
  if(S.audStream)S.audStream.getTracks().forEach(t=>t.stop());
  if(S.audCtx)S.audCtx.close();
  S.audRec=false;S.audCtx=null;S.audAna=null;clearInterval(_wt);render();
}
function dlAudio(){if(!S.audBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(S.audBlob);a.download='savix_audio_'+Date.now()+'.webm';a.click()}
let _wt=null;
function startWave(){
  _wt=setInterval(()=>{
    document.querySelectorAll('.wbar').forEach((b,i)=>{
      if(S.audAna){const d=new Uint8Array(S.audAna.frequencyBinCount);S.audAna.getByteFrequencyData(d);b.style.height=Math.max(3,(d[i]||0)/255*36)+'px'}
      else b.style.height=Math.random()*20+3+'px';
    });
  },80);
}

/* ─── VIDEO ──────────────────────────────────── */
async function startVideo(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:true});
    S.vidStream=st;S.vidChunks=[];
    const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
    S.vidRecObj=new MediaRecorder(st,{mimeType:mime});
    S.vidRecObj.ondataavailable=e=>{if(e.data.size>0)S.vidChunks.push(e.data)};
    S.vidRecObj.onstop=()=>{S.vidBlob=new Blob(S.vidChunks,{type:'video/webm'})};
    S.vidRecObj.start(2000);S.vidRec=true;
    aiMsg('📹 Video recording started.','ai');render();
  }catch{aiMsg('⚠️ Camera access denied.','ai')}
}
function stopVideo(){
  if(S.vidRecObj&&S.vidRecObj.state!=='inactive')S.vidRecObj.stop();
  if(S.vidStream)S.vidStream.getTracks().forEach(t=>t.stop());
  S.vidRec=false;render();
}
function dlVideo(){if(!S.vidBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(S.vidBlob);a.download='savix_video_'+Date.now()+'.webm';a.click()}

/* ─── AMBIENT ────────────────────────────────── */
let _as=null,_ac=null,_aa=null,_at=null;
async function startAmb(){
  try{
    _as=await navigator.mediaDevices.getUserMedia({audio:true});
    _ac=new(window.AudioContext||window.webkitAudioContext)();
    _aa=_ac.createAnalyser();_aa.fftSize=256;
    _ac.createMediaStreamSource(_as).connect(_aa);
    _at=setInterval(()=>{
      const d=new Uint8Array(_aa.frequencyBinCount);_aa.getByteFrequencyData(d);
      S.ambVol=Math.min(100,Math.round(d.reduce((a,b)=>a+b,0)/d.length/128*100));
      const bar=document.getElementById('amb-bar'),lbl=document.getElementById('amb-lbl');
      const c=S.ambVol>70?'var(--red)':S.ambVol>40?'#f59e0b':'var(--olive3)';
      if(bar){bar.style.width=S.ambVol+'%';bar.style.background=c}
      if(lbl){lbl.textContent=S.ambVol+'%';lbl.style.color=c}
      if(S.ambVol>85&&!S.sos)aiMsg('🔊 Loud sound detected ('+S.ambVol+'%). Stay alert.','ai');
    },300);
    aiMsg('🔊 Ambient monitoring ON.','ai');
  }catch{aiMsg('⚠️ Microphone needed for ambient monitor.','ai')}
}
function stopAmb(){clearInterval(_at);if(_as)_as.getTracks().forEach(t=>t.stop());if(_ac)_ac.close();S.ambVol=0}

/* ─── RISK ───────────────────────────────────── */
function risk(){
  if(!S.sos)return{s:0,l:'SAFE',c:'#22c55e'};
  let s=30;
  const mins=Math.floor((Date.now()-S.sos.start)/60000);
  if(S.audRec)s+=10;if(S.speed>60)s+=15;if(S.sos.trigger==='Fall Detection')s+=25;
  if(S.sos.trigger==='Voice AI'||S.sos.trigger==='Voice Command')s+=15;
  s+=Math.min(20,mins*5);s=Math.min(s,99);
  const l=s>75?'CRITICAL':s>50?'HIGH':s>25?'MODERATE':'LOW';
  const c=s>75?'#ef4444':s>50?'#f97316':s>25?'#f59e0b':'#22c55e';
  return{s,l,c};
}

function aiMsg(text,from){

/* ─── SOS ENGINE ─────────────────────────────── */
let holdT=null,holdP=0;
function startHold(){
  if(S.sos)return;holdP=0;
  holdT=setInterval(()=>{
    holdP+=5;
    const a=document.getElementById('sarc');if(a)a.setAttribute('stroke-dashoffset',691*(1-holdP/100));
    if(holdP>=100){clearInterval(holdT);triggerSOS('Manual Hold')}
  },100);
}
function stopHold(){
  if(holdT){clearInterval(holdT);holdT=null}holdP=0;
  const a=document.getElementById('sarc');if(a)a.setAttribute('stroke-dashoffset',691);
}
let cdT=null;
function startCD(){
  let n=3;const o=document.getElementById('cdo');if(o){o.style.display='flex'}
  const nd=document.getElementById('cdn');if(nd)nd.textContent=n;
  cdT=setInterval(()=>{
    n--;const x=document.getElementById('cdn');if(x)x.textContent=n;
    if(n<=0){clearInterval(cdT);const o=document.getElementById('cdo');if(o)o.style.display='none';triggerSOS('Manual Count')}
  },1000);
}
function cancelCD(){if(cdT){clearInterval(cdT);cdT=null}const o=document.getElementById('cdo');if(o)o.style.display='none'}

let ciT=null;
async function triggerSOS(trigger){
  if(S.sos)return;
  S.sos={id:'sos_'+Date.now(),trigger,cat:S.sosCat,start:Date.now(),gps:S.gps};
  S.trackPts=S.gps?[[S.gps.lat,S.gps.lng]]:[];S.timeline=[];
  addTL('🚨 SOS triggered via '+trigger,'r');
  addLog('SOS Triggered',S.ses&&S.ses.name,'Via '+trigger+' · '+S.sosCat);
  setTimeout(()=>tts('Emergency alert activated. Your emergency contacts are being notified. Stay calm. Help is coming.'),400);
  aiMsg('🚨 <b>SOS ACTIVE</b> via '+trigger+'.<br/>📍 Live GPS sharing on. Contacts alerted.','ai');
  await startAudio();
  if(S.cfg.vidOnSos)startVideo();
  addTL('🎙️ Audio recording started','g');addTL('📍 GPS tracking on','g');addTL('📤 Contacts alerted','g');
  contactPriority();
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,500]);
  if(ciT)clearInterval(ciT);
  ciT=setInterval(()=>{
    if(!S.sos){clearInterval(ciT);return}
    tts('Safety check. Are you still okay?');
    aiMsg('🤖 Safety check-in — tap ✅ I Am Safe if resolved.','ai');
  },S.cfg.checkIn*1000);
  S.tab='active';render();
}
function contactPriority(){
  const cs=S.ses&&S.ses.contacts||[];
  if(!cs.length){aiMsg('⚠️ No emergency contacts added. Go to Contacts tab.','ai');return}
  const h=new Date().getHours();
  const ord=[...cs].sort((a)=>(['Mother','Father','Spouse'].includes(a.relation)&&(h>=22||h<6))?-1:0);
  aiMsg('📞 Alerting: '+ord.slice(0,3).map(c=>c.name).join(' → ')+'…','ai');
  addTL('📞 Alerting: '+ord.slice(0,2).map(c=>c.name).join(', ')+'…','b');
  
  // Get top priority contact
  const topC = ord[0];
  if(topC && topC.phone) {
    const locStr = S.gps ? ('https://maps.google.com/?q='+S.gps.lat+','+S.gps.lng) : 'Location pending...';
    const msg = '🚨 SOS EMERGENCY! I need help urgently. Live Location: ' + locStr;
    
    // Attempt Auto-SMS
    setTimeout(() => {
      const smsLink = document.createElement('a');
      smsLink.href = 'sms:' + topC.phone + '?body=' + encodeURIComponent(msg);
      smsLink.target = '_blank';
      smsLink.click();
      aiMsg('✉️ Sent automated SOS SMS to ' + topC.name, 'ai');
    }, 1500);

    // Attempt Auto-Call
    setTimeout(() => {
      const callLink = document.createElement('a');
      callLink.href = 'tel:' + topC.phone;
      callLink.click();
      aiMsg('📞 Initiating automatic emergency call to ' + topC.name, 'ai');
    }, 4500);
  }
}
function addTL(text,type){
  S.timeline.push({text,type,t:new Date().toLocaleTimeString()});
  const el=document.getElementById('tl');
  if(el){
    const styles={g:'background:rgba(77,124,15,.2);color:#86efac',r:'background:rgba(220,38,38,.2);color:#fca5a5',b:'background:rgba(59,130,246,.15);color:#93c5fd'};
    const ic=type==='r'?'🚨':type==='b'?'📞':'✅';
    el.insertAdjacentHTML('afterbegin',
      `<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
        <div style="width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;${styles[type]||styles.g}">${ic}</div>
        <div><div style="font-size:11px;font-weight:700;color:var(--txt)">${text}</div>
        <div style="font-size:9px;color:var(--txt3)">${new Date().toLocaleTimeString()}</div></div></div>`);
  }
}
function addLog(a,actor,d){
  S.logs=S.logs||[];S.logs.unshift({t:new Date().toLocaleTimeString(),a,actor:actor||'System',d});
}

function showResolve(){

function resolveSOS(){
  if(!S.sos)return;
  tts('You are marked as safe. Emergency session ended.');
  addLog('SOS Resolved',S.ses&&S.ses.name,'Session '+S.sos.id);
  stopAudio();stopVideo();if(ciT)clearInterval(ciT);
  S.sos=null;S.trackPts=[];
  try{if(S.track)S.track.remove()}catch{}S.track=null;
  const m=document.getElementById('resolve-modal');if(m)m.innerHTML='';
  S.tab='dashboard';render();
}

  saveDB(db);saveSes(S.ses);

  if(!confirm('Remove this contact?'))return;
  const c=[...(S.ses.contacts||[])];c.splice(i,1);updSes({contacts:c});render();

  clearSes();S.ses=null;S.sos=null;

  render();
}

function renderTab(){
  if(S.tab==='dashboard')return renderDash();
  if(S.tab==='sos')return renderSOS();
  if(S.tab==='active')return S.sos?renderActive():(S.tab='dashboard',renderDash());
  if(S.tab==='nearby')return renderNearby();
  if(S.tab==='contacts')return renderContacts();

          <button class="sw ${S.cfg[x.k]?'on':''}" onclick="S.cfg['${x.k}']=!S.cfg['${x.k}'];render()"></button>
        </div>`).join('')}
      </div>
    </div>
    <div>
      <div style="font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;margin-bottom:7px">Audit Log</div>
      <div style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px">
        ${(S.logs||[]).slice(0,10).map(l=>`<div class="card2" style="padding:8px 10px;display:flex;gap:7px">
          <span style="font-size:9px;font-family:JetBrains Mono;color:var(--txt3);flex-shrink:0">${l.t}</span>
          <div><span style="font-size:10px;font-weight:700;color:var(--olive3)">${l.a}</span> <span style="font-size:9px;color:var(--txt3)">by ${l.actor}</span>
          <div style="font-size:9px;color:var(--txt2)">${l.d}</div></div>
        </div>`).join('')||`<div style="text-align:center;font-size:11px;color:var(--txt3);padding:10px">No log entries yet.</div>`}
      </div>
    </div>
  </div>
</div>`;
}

/* ─── AUTH BIND ──────────────────────────────── */
function bindAuth(){
  document.getElementById('lf')&&document.getElementById('lf').addEventListener('submit',e=>{
    e.preventDefault();
    const email=document.getElementById('le').value.trim().toLowerCase();
    const pass=document.getElementById('lp').value;
    const db=loadDB(),err=document.getElementById('lerr');
    if(!db[email]){err.textContent='No account found with this email.';err.style.display='block';return}
    if(db[email].pw!==btoa(pass)){err.textContent='Incorrect password.';err.style.display='block';return}
    S.ses={...db[email]};delete S.ses.pw;saveSes(S.ses);
    addLog('Login',S.ses.name,'Authenticated successfully.');
    aiMsg('👋 Welcome back, '+S.ses.name+'! GPS starting. All systems ready.','ai');
    startGPS();initBatt();render();
  });
  document.getElementById('rf')&&document.getElementById('rf').addEventListener('submit',e=>{
    e.preventDefault();
    const name=document.getElementById('rn').value.trim();
    const phone=document.getElementById('rp').value.trim();
    const email=document.getElementById('re').value.trim().toLowerCase();
    const pass=document.getElementById('rpw').value;
    const cpass=document.getElementById('rcp').value;
    const blood=document.getElementById('rb').value;
    const ec=document.getElementById('rec').value.trim();
    const err=document.getElementById('rerr');
    if(pass!==cpass){err.textContent='Passwords do not match.';err.style.display='block';return}
    if(pass.length<6){err.textContent='Password must be at least 6 characters.';err.style.display='block';return}
    const db=loadDB();
    if(db[email]){err.textContent='Account already exists. Please login.';err.style.display='block';return}
    const user={name,phone,email,gender:document.getElementById('rg').value,
      pw:btoa(pass),contacts:ec?[{name:'Emergency Contact',phone:ec,relation:'Guardian',email:''}]:[],
      medical:{blood},createdAt:new Date().toISOString()};
    db[email]=user;saveDB(db);
    S.ses={...user};delete S.ses.pw;saveSes(S.ses);
    addLog('Registered',name,email);
    aiMsg('🎉 Welcome to SAVIX-AI, '+name+'! Add emergency contacts and enable voice AI for maximum protection.','ai');
    startGPS();initBatt();render();
  });
}

/* ─── APP BIND ───────────────────────────────── */
function bindApp(){
  document.getElementById('acf')&&document.getElementById('acf').addEventListener('submit',e=>{
    e.preventDefault();
    const c={name:document.getElementById('cn').value.trim(),relation:document.getElementById('cr').value,
      phone:document.getElementById('cp').value.trim(),email:document.getElementById('ce').value.trim()};
    if(!c.name||!c.phone){alert('Name and phone are required.');return}
    updSes({contacts:[...(S.ses.contacts||[]),c]});
    document.getElementById('acm').style.display='none';
    addLog('Contact Added',S.ses.name,'Added: '+c.name);render();
  });
  document.getElementById('mdf')&&document.getElementById('mdf').addEventListener('submit',e=>{
    e.preventDefault();
    const medical={blood:document.getElementById('mb').value,height:document.getElementById('mh').value,
      weight:document.getElementById('mw').value,donor:document.getElementById('md').value,
      allergy:document.getElementById('ma').value,conditions:document.getElementById('mc').value,
      meds:document.getElementById('mm').value,notes:document.getElementById('mn').value};
    updSes({medical});addLog('Medical Updated',S.ses.name,'Profile saved.');
    alert('✅ Medical profile saved!');
  });
}

/* ─── SOS TIMER (surgical update) ───────────── */
setInterval(()=>{
  if(!S.sos||S.tab!=='active')return;
  const el=document.getElementById('elapsed');if(!el)return;
  const t=Math.floor((Date.now()-S.sos.start)/1000);
  el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
},1000);

/* ─── INIT ───────────────────────────────────── */
S.logs=[{t:new Date().toLocaleTimeString(),a:'System Start',actor:'SAVIX Engine',d:'All 12 modules initialized.'}];
S.aiMsgs=[{text:'🚀 <b>SAVIX-AI v6.0</b> ready. Login to activate full emergency protection.',from:'ai',t:new Date().toLocaleTimeString()}];
render();
if(S.ses){startGPS();initBatt()}
</script>
